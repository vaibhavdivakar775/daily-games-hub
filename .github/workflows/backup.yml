# Nightly backup of the leaderboard: copies the whole Supabase `scores` table into
# backup/scores.json in this repo. Free; runs on GitHub's servers. The daily request also
# keeps the free Supabase project from pausing for inactivity.
name: Back up leaderboard

on:
  schedule:
    - cron: '25 18 * * *'   # 23:55 India time, after the day's games
  workflow_dispatch:         # "Run workflow" button for a manual backup

permissions:
  contents: write

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download every score from Supabase
        run: |
          set -euo pipefail
          URL=$(grep -oE "SUPABASE_URL = '[^']+'" config.js | cut -d"'" -f2)
          KEY=$(grep -oE "SUPABASE_ANON_KEY = '[^']+'" config.js | cut -d"'" -f2)
          mkdir -p backup
          echo '[]' > backup/scores.json.tmp
          # The API returns at most 1000 rows per request, so page through the table.
          offset=0
          while :; do
            page=$(curl -sS --fail --retry 4 --retry-delay 5 --retry-all-errors \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
              "$URL/rest/v1/scores?select=*&order=date,grp,name_key,game&limit=1000&offset=$offset")
            n=$(echo "$page" | jq 'length')
            jq -s '.[0] + .[1]' backup/scores.json.tmp <(echo "$page") > backup/merged.tmp && mv backup/merged.tmp backup/scores.json.tmp
            [ "$n" -lt 1000 ] && break
            offset=$((offset + 1000))
          done
          mv backup/scores.json.tmp backup/scores.json   # only replace once the download is complete
          echo "saved backup/scores.json ($(jq 'length' backup/scores.json) scores)"

      - name: Commit if anything changed
        run: |
          git config user.name "dailyhub-backup"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backup
          if git diff --cached --quiet; then
            echo "No changes since the last backup."
          else
            git commit -m "Leaderboard backup $(date -u +%Y-%m-%d)"
            git push
          fi
